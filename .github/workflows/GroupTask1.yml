name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flake8
        run: pip install flake8

      - name: Run linter
        run: flake8 tests/test_progress.py --max-line-length=9999 --exit-zero

      - name: Run tests
        run: python tests/test_progress.py -v -s
